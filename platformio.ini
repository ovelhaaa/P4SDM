[platformio]
default_envs = guition_audio
boards_dir = boards

[env:guition_audio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = jc4880p4
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_TEST_AUDIO=1
    -DFEATURE_USB_MIDI=0
build_src_filter = +<audio_diagnostic.cpp> +<hal/*.cpp>

[env:guition_boot]
extends = env:guition_audio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_TEST_AUDIO=0
    -DFEATURE_USB_MIDI=0

[env:guition_synth]
extends = env:guition_audio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_HEADLESS=1
    -DFEATURE_USB_MIDI=0
build_src_filter = +<synth_diagnostic.cpp> +<hal/*.cpp>

[env:guition_fx]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_FX_DIAGNOSTIC=1

[env:guition_display]
extends = env:guition_audio
build_flags = ${env:guition_audio.build_flags} -DP4SDM_DISPLAY=1
build_src_filter = +<display_diagnostic.cpp> +<hal/*.cpp>

[env:guition_ui_audio]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_UI_DIAGNOSTIC=1

[env:guition_ui_audio_m41]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_PIPELINE_DIAGNOSTIC=1
[env:guition_app]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_APP=1 -DP4SDM_APP_DIAGNOSTICS=0
build_src_filter = +<app_main.cpp> +<app/*.cpp> +<hal/*.cpp>

; Scripted real-device load complements (does not replace) physical touch QA.
[env:guition_app_stress]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_APP_STRESS=1

[env:guition_sampler_stress]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLER_QUALIFICATION=1

; Resident PSRAM fixtures exercise M13 without a physical SD card.
[env:guition_sample_playback_stress]
extends = env:guition_app_stress
build_flags = ${env:guition_app_stress.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1

; M14 retains the M13 fixture and dense audio workload.
[env:guition_sample_slice_stress]
extends = env:guition_sample_playback_stress
build_flags = ${env:guition_sample_playback_stress.build_flags} -DP4SDM_SAMPLE_SLICE_STRESS=1
