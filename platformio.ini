[platformio]
default_envs = guition_audio
boards_dir = boards

[env:guition_audio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = jc4880p4
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_TEST_AUDIO=1
    -DFEATURE_USB_MIDI=0
build_src_filter = +<audio_diagnostic.cpp> +<hal/*.cpp>

[env:guition_boot]
extends = env:guition_audio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_TEST_AUDIO=0
    -DFEATURE_USB_MIDI=0

[env:guition_synth]
extends = env:guition_audio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DP4SDM_HEADLESS=1
    -DFEATURE_USB_MIDI=0
build_src_filter = +<synth_diagnostic.cpp> +<hal/*.cpp>

[env:guition_fx]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_FX_DIAGNOSTIC=1

[env:guition_display]
extends = env:guition_audio
build_flags = ${env:guition_audio.build_flags} -DP4SDM_DISPLAY=1
build_src_filter = +<display_diagnostic.cpp> +<hal/*.cpp>

[env:guition_ui_audio]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_UI_DIAGNOSTIC=1

[env:guition_ui_audio_m41]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_PIPELINE_DIAGNOSTIC=1
[env:guition_app]
extends = env:guition_synth
build_flags = ${env:guition_synth.build_flags} -DP4SDM_DISPLAY=1 -DP4SDM_APP=1 -DP4SDM_APP_DIAGNOSTICS=0
build_src_filter = +<app_main.cpp> +<app/*.cpp> +<hal/*.cpp>

; Scripted real-device load complements (does not replace) physical touch QA.
[env:guition_app_stress]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_APP_STRESS=1

[env:guition_sampler_stress]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLER_QUALIFICATION=1

; Resident PSRAM fixtures exercise M13 without a physical SD card.
[env:guition_sample_playback_stress]
extends = env:guition_app_stress
build_flags = ${env:guition_app_stress.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1

; M14 retains the M13 fixture and dense audio workload.
[env:guition_sample_slice_stress]
extends = env:guition_sample_playback_stress
build_flags = ${env:guition_sample_playback_stress.build_flags} -DP4SDM_SAMPLE_SLICE_STRESS=1

; M15 retains all M14 sample qualification work.
[env:guition_slice_lock_stress]
extends = env:guition_sample_slice_stress
build_flags = ${env:guition_sample_slice_stress.build_flags} -DP4SDM_SLICE_LOCK_STRESS=1

[env:guition_project_stress]
extends = env:guition_slice_lock_stress
build_flags = ${env:guition_slice_lock_stress.build_flags} -DP4SDM_PROJECT_STRESS=1

[env:guition_project_synth_stress]
extends = env:guition_app_stress
build_flags = ${env:guition_app_stress.build_flags} -DP4SDM_PROJECT_STRESS=1

[env:guition_chain_stress]
extends = env:guition_project_stress
build_flags = ${env:guition_project_stress.build_flags} -DP4SDM_CHAIN_STRESS=1

[env:guition_chain_synth_stress]
extends = env:guition_project_synth_stress
build_flags = ${env:guition_project_synth_stress.build_flags} -DP4SDM_CHAIN_STRESS=1

; M18 retains the full M17/M16 dense fixtures before performance interaction.
[env:guition_performance_stress]
extends = env:guition_chain_stress
build_flags = ${env:guition_chain_stress.build_flags} -DP4SDM_PERFORMANCE_STRESS=1

[env:guition_performance_synth_stress]
extends = env:guition_chain_synth_stress
build_flags = ${env:guition_chain_synth_stress.build_flags} -DP4SDM_PERFORMANCE_STRESS=1

; M18.1 adds immutable accepted-event x2/x4/x8 windows after M18 stress.
[env:guition_repeat_stress]
extends = env:guition_performance_stress
build_flags = ${env:guition_performance_stress.build_flags} -DP4SDM_REPEAT_STRESS=1

[env:guition_repeat_synth_stress]
extends = env:guition_performance_synth_stress
build_flags = ${env:guition_performance_synth_stress.build_flags} -DP4SDM_REPEAT_STRESS=1

[env:guition_transient_stress]
extends = env:guition_repeat_stress
build_flags = ${env:guition_repeat_stress.build_flags} -DP4SDM_TRANSIENT_STRESS=1

[env:guition_transient_synth_stress]
extends = env:guition_repeat_synth_stress
build_flags = ${env:guition_repeat_synth_stress.build_flags} -DP4SDM_TRANSIENT_STRESS=1

; M20 changes only UI navigation/drawing during the accepted dense M19 load.
[env:guition_ui20_stress]
extends = env:guition_transient_stress
build_flags = ${env:guition_transient_stress.build_flags} -DP4SDM_UI20_STRESS=1

[env:guition_ui20_synth_stress]
extends = env:guition_transient_synth_stress
build_flags = ${env:guition_transient_synth_stress.build_flags} -DP4SDM_UI20_STRESS=1

; Same complete M20/M19 workload, stable compile-time mode, no adaptive quality.
[env:guition_interp_nearest_stress]
extends = env:guition_ui20_stress
build_flags = ${env:guition_ui20_stress.build_flags} -DP4SDM_INTERPOLATION=0 -DP4SDM_INTERPOLATION_QUALIFICATION=1

[env:guition_interp_linear_stress]
extends = env:guition_ui20_stress
build_flags = ${env:guition_ui20_stress.build_flags} -DP4SDM_INTERPOLATION=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1

[env:guition_interp_hermite_stress]
extends = env:guition_ui20_stress
build_flags = ${env:guition_ui20_stress.build_flags} -DP4SDM_INTERPOLATION=2 -DP4SDM_INTERPOLATION_QUALIFICATION=1

; Legacy M21/M21.1 names retained for build compatibility. M21.2 removes their
; per-block forced transport and prints a deprecation marker. Use M212 B/C for
; accepted-event fractional qualification; original captures remain historical.
[env:guition_interp_linear_fractional_stress]
extends = env:guition_interp_linear_stress
build_flags = ${env:guition_interp_linear_stress.build_flags} -DP4SDM_INTERPOLATION_FRACTIONAL_STRESS=1

[env:guition_interp_nearest_fractional_stress]
extends = env:guition_interp_nearest_stress
build_flags = ${env:guition_interp_nearest_stress.build_flags} -DP4SDM_INTERPOLATION_FRACTIONAL_STRESS=1

; M21.1 isolated real-PSRAM access control, before audio task startup.
[env:guition_pcm_locality]
extends = env:guition_interp_nearest_fractional_stress
build_flags = ${env:guition_interp_nearest_fractional_stress.build_flags} -DP4SDM_PCM_LOCALITY_QUALIFICATION=1

; Isolate one locality change against exactly the inherited inputs.
[env:guition_pcm_cache_nearest_fractional]
extends = env:guition_interp_nearest_fractional_stress
build_flags = ${env:guition_interp_nearest_fractional_stress.build_flags} -DP4SDM_PCM_READ_CACHE=1

[env:guition_pcm_cache_linear_fractional]
extends = env:guition_interp_linear_fractional_stress
build_flags = ${env:guition_interp_linear_fractional_stress.build_flags} -DP4SDM_PCM_READ_CACHE=1

[env:guition_pcm_cache_nearest_mixed]
extends = env:guition_interp_nearest_stress
build_flags = ${env:guition_interp_nearest_stress.build_flags} -DP4SDM_PCM_READ_CACHE=1

[env:guition_pcm_cache_nearest_profile]
extends = env:guition_pcm_cache_nearest_fractional
build_flags = ${env:guition_pcm_cache_nearest_fractional.build_flags} -DP4SDM_BLOCK_PROFILE=1

[env:guition_pcm_cache_linear32_fractional]
extends = env:guition_pcm_cache_linear_fractional
build_flags = ${env:guition_pcm_cache_linear_fractional.build_flags} -DP4SDM_LINEAR_32BIT=1

; Separate non-realtime hardware audit. No audio or display workload.
[env:guition_m212_memory]
extends = env:guition_app
build_src_filter = +<memory_qualification.cpp>

[env:guition_m212_fixture]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_PCM_READ_CACHE=1 -DP4SDM_PCM_CACHE_FRAMES=32 -DP4SDM_PCM_CACHE_FILL=0

[env:guition_m212_B_nearest]
extends = env:guition_m212_fixture
build_flags = ${env:guition_m212_fixture.build_flags} -DP4SDM_M212_SCENARIO=2 -DP4SDM_INTERPOLATION=0

[env:guition_m212_B_linear32]
extends = env:guition_m212_B_nearest
build_flags = ${env:guition_m212_fixture.build_flags} -DP4SDM_M212_SCENARIO=2 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1

[env:guition_m212_C_nearest]
extends = env:guition_m212_B_nearest
build_flags = ${env:guition_m212_fixture.build_flags} -DP4SDM_M212_SCENARIO=3 -DP4SDM_INTERPOLATION=0

[env:guition_m212_C_linear32]
extends = env:guition_m212_C_nearest
build_flags = ${env:guition_m212_fixture.build_flags} -DP4SDM_M212_SCENARIO=3 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1

[env:guition_m212_A_linear32]
extends = env:guition_interp_linear_stress
build_flags = ${env:guition_interp_linear_stress.build_flags} -DP4SDM_PCM_READ_CACHE=1 -DP4SDM_LINEAR_32BIT=1

[env:guition_m212_B_magnitude]
extends = env:guition_m212_B_linear32
build_flags = ${env:guition_m212_B_linear32.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m212_B_validated]
extends = env:guition_m212_B_linear32
build_flags = ${env:guition_m212_B_linear32.build_flags} -DP4SDM_PCM_CACHE_VALIDATED=1

[env:guition_m212_B_full_gain]
extends = env:guition_m212_B_linear32
build_flags = ${env:guition_m212_B_linear32.build_flags} -DP4SDM_FULL_GAIN_FASTPATH=1

; M21.3 diagnostic placement controls. Production remains unchanged.
[env:guition_m213_B_current]
extends = env:guition_m212_B_nearest
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_M212_SCENARIO=2

[env:guition_m213_B_stagger]
extends = env:guition_m213_B_current
build_flags = ${env:guition_m213_B_current.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=1

[env:guition_m213_B_normal]
extends = env:guition_m213_B_current
build_flags = ${env:guition_m213_B_current.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_B_reverse_order]
extends = env:guition_m213_B_current
build_flags = ${env:guition_m213_B_current.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=3

[env:guition_m213_B_normal_cache]
extends = env:guition_m212_B_nearest
build_flags = ${env:guition_m212_B_nearest.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_B_linear]
extends = env:guition_m212_B_linear32
build_flags = ${env:guition_m212_B_linear32.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_B_magnitude]
extends = env:guition_m212_B_magnitude
build_flags = ${env:guition_m212_B_magnitude.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_C_magnitude]
extends = env:guition_m212_C_linear32
build_flags = ${env:guition_m212_C_linear32.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_A_magnitude]
extends = env:guition_m212_A_linear32
build_flags = ${env:guition_m212_A_linear32.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_M213_FIXTURE_LAYOUT=2

[env:guition_m213_B_profile]
extends = env:guition_m213_B_magnitude
build_flags = ${env:guition_m213_B_magnitude.build_flags} -DP4SDM_BLOCK_PROFILE=1 -DP4SDM_M213_DSP_STAGES=1

[env:guition_m213_B_linear_direct]
extends = env:guition_m213_B_normal
build_flags = ${env:guition_m213_B_normal.build_flags} -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1

[env:guition_m213_B_magnitude_direct]
extends = env:guition_m213_B_linear_direct
build_flags = ${env:guition_m213_B_linear_direct.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_C_magnitude_direct]
extends = env:guition_m213_B_magnitude_direct
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_M212_SCENARIO=3 -DP4SDM_M213_FIXTURE_LAYOUT=2 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_A_magnitude_direct]
extends = env:guition_interp_linear_stress
build_flags = ${env:guition_interp_linear_stress.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=2 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_memory]
extends = env:guition_app
build_src_filter = +<m213_memory_qualification.cpp>

[env:guition_m213_B_sustained]
extends = env:guition_m213_B_magnitude_direct
build_flags = ${env:guition_m213_B_magnitude_direct.build_flags} -DP4SDM_M213_CAPTURE_BLOCKS=103360 -DP4SDM_M213_MONITOR=1

[env:guition_m213_synth]
extends = env:guition_ui20_synth_stress
build_flags = ${env:guition_ui20_synth_stress.build_flags}

; Real-WAV controls justify testing bounded staggering in the full renderer.
[env:guition_m213_pad_fixture]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_M213_FIXTURE_LAYOUT=1 -DP4SDM_M213_LAYOUT=1

[env:guition_m213_B_pad_linear_direct]
extends = env:guition_m213_pad_fixture
build_flags = ${env:guition_m213_pad_fixture.build_flags} -DP4SDM_M212_SCENARIO=2 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1

[env:guition_m213_B_pad_linear_cache]
extends = env:guition_m213_B_pad_linear_direct
build_flags = ${env:guition_m213_B_pad_linear_direct.build_flags} -DP4SDM_PCM_READ_CACHE=1

[env:guition_m213_B_pad_magnitude_cache]
extends = env:guition_m213_B_pad_linear_cache
build_flags = ${env:guition_m213_B_pad_linear_cache.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_B_pad_magnitude_direct]
extends = env:guition_m213_B_pad_linear_direct
build_flags = ${env:guition_m213_B_pad_linear_direct.build_flags} -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_C_pad_magnitude_direct]
extends = env:guition_m213_pad_fixture
build_flags = ${env:guition_m213_pad_fixture.build_flags} -DP4SDM_M212_SCENARIO=3 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_A_pad_magnitude_direct]
extends = env:guition_interp_linear_stress
build_flags = ${env:guition_interp_linear_stress.build_flags} -DP4SDM_M213_FIXTURE_LAYOUT=1 -DP4SDM_M213_LAYOUT=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1

[env:guition_m213_B_pad_sustained]
extends = env:guition_m213_B_pad_magnitude_direct
build_flags = ${env:guition_m213_B_pad_magnitude_direct.build_flags} -DP4SDM_M213_CAPTURE_BLOCKS=103360 -DP4SDM_M213_MONITOR=1

[env:guition_m213_synth_pad_sustained]
extends = env:guition_ui20_synth_stress
build_flags = ${env:guition_ui20_synth_stress.build_flags} -DP4SDM_M213_LAYOUT=1 -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_M213_CAPTURE_BLOCKS=103360 -DP4SDM_M213_MONITOR=1

; M21.4 release proposal. Normal production stays Nearest until both gates pass.
[env:guition_app_nearest_legacy]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_INTERPOLATION=0 -DP4SDM_LINEAR_32BIT=0 -DP4SDM_LINEAR_MAGNITUDE=0 -DP4SDM_PCM_READ_CACHE=0 -DP4SDM_PCM_PLACEMENT=0

[env:guition_app_linear_candidate]
extends = env:guition_app
build_flags = ${env:guition_app.build_flags} -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_PCM_READ_CACHE=0 -DP4SDM_PCM_PLACEMENT=1

[env:guition_m214_A]
extends = env:guition_ui20_stress
build_flags = ${env:guition_ui20_stress.build_flags} -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_PCM_READ_CACHE=0 -DP4SDM_PCM_PLACEMENT=1 -DP4SDM_M213_FIXTURE_LAYOUT=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1

[env:guition_m214_B]
extends = env:guition_app_linear_candidate
build_flags = ${env:guition_app_linear_candidate.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_M212_SCENARIO=2 -DP4SDM_M213_FIXTURE_LAYOUT=1

[env:guition_m214_C]
extends = env:guition_m214_B
build_flags = ${env:guition_app_linear_candidate.build_flags} -DP4SDM_SAMPLE_PLAYBACK_STRESS=1 -DP4SDM_INTERPOLATION_QUALIFICATION=1 -DP4SDM_M212_SCENARIO=3 -DP4SDM_M213_FIXTURE_LAYOUT=1

[env:guition_m214_SAMPLE_sustained]
extends = env:guition_m214_B
build_flags = ${env:guition_m214_B.build_flags} -DP4SDM_M213_CAPTURE_BLOCKS=103360 -DP4SDM_M213_MONITOR=1

[env:guition_m214_SYNTH_sustained]
extends = env:guition_ui20_synth_stress
build_flags = ${env:guition_ui20_synth_stress.build_flags} -DP4SDM_INTERPOLATION=1 -DP4SDM_LINEAR_32BIT=1 -DP4SDM_LINEAR_MAGNITUDE=1 -DP4SDM_PCM_READ_CACHE=0 -DP4SDM_PCM_PLACEMENT=1 -DP4SDM_M213_CAPTURE_BLOCKS=103360 -DP4SDM_M213_MONITOR=1
