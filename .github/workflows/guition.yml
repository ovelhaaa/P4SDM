name: Guition diagnostics
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - run: pip install platformio==6.1.18
      # platformio.ini pins hardware-validated pioarduino 55.03.36-1.
      - run: pio run -e guition_boot -e guition_audio -e guition_synth -e guition_fx -e guition_display -e guition_ui_audio -e guition_ui_audio_m41 -e guition_app -e guition_app_stress -e guition_sampler_stress -e guition_sample_playback_stress -e guition_sample_slice_stress -e guition_slice_lock_stress -e guition_project_stress -e guition_project_synth_stress -e guition_chain_stress -e guition_chain_synth_stress -e guition_performance_stress -e guition_performance_synth_stress -e guition_repeat_stress -e guition_repeat_synth_stress
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/pcm_mono_test.cpp -o /tmp/pcm_mono_test && /tmp/pcm_mono_test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests/fx_stubs tests/fx_safety_test.cpp -o /tmp/fx_safety_test && /tmp/fx_safety_test
      - run: python tests/compare_fx_baseline.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/display_geometry_test.cpp -o /tmp/display_geometry_test && /tmp/display_geometry_test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/display_dirty_test.cpp -o /tmp/display_dirty_test && /tmp/display_dirty_test
      - run: python tests/analyze_m4.py docs/GUITION_M4_UI_AUDIO_SERIAL.log --display-log docs/GUITION_M4_DISPLAY_SERIAL.log
      - run: python tests/analyze_m41.py docs/GUITION_M41_SHORT_SERIAL.log docs/GUITION_M41_INTERACTION_SERIAL.log --require-interaction

      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/app_model_test.cpp -o /tmp/app_model_test && /tmp/app_model_test

      - run: python tests/analyze_m5.py docs/GUITION_M5_STRESS_SERIAL.log --stress

      - run: python tests/generate_m6_fixtures.py /tmp/m6-fixtures
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pthread tests/wav_sampler_test.cpp -o /tmp/wav_sampler_test && /tmp/wav_sampler_test /tmp/m6-fixtures

      - run: python tests/analyze_m6.py docs/GUITION_M6_NO_CARD_STRESS_SERIAL.log

      - run: python tests/analyze_m6.py docs/GUITION_M61_NO_CARD_STRESS_SERIAL.log

      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/pattern_engine_test.cpp -o /tmp/pattern_engine_test && /tmp/pattern_engine_test

      - run: python tests/analyze_m7.py docs/GUITION_M7_STRESS_SERIAL.log

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/groove_engine_test.cpp -o /tmp/groove_engine_test && /tmp/groove_engine_test

      - run: python tests/analyze_m8.py docs/GUITION_M8_STRESS_SERIAL.log

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/pattern_tools_test.cpp -o /tmp/pattern_tools_test && /tmp/pattern_tools_test

      - run: python tests/analyze_m9.py docs/GUITION_M9_STRESS_SERIAL.log

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/parameter_locks_test.cpp -o /tmp/parameter_locks_test && /tmp/parameter_locks_test
      - run: python tests/no_lock_equivalence.py
      - run: python tests/analyze_m10.py docs/GUITION_M10_STRESS_SERIAL.log
      - run: python tests/analyze_m10.py docs/GUITION_M10_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/track_tone_test.cpp -o /tmp/track_tone_test && /tmp/track_tone_test
      - run: python tests/tone_equivalence.py
      - run: python tests/no_tone_equivalence.py
      - run: python tests/analyze_m11.py docs/GUITION_M11_STRESS_SERIAL.log
      - run: python tests/analyze_m11.py docs/GUITION_M11_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/tone_locks_test.cpp -o /tmp/tone_locks_test && /tmp/tone_locks_test
      - run: python tests/no_tone_lock_equivalence.py
      - run: python tests/tone_lock_routing_equivalence.py
      - run: python tests/analyze_m12.py docs/GUITION_M12_STRESS_SERIAL.log
      - run: python tests/analyze_m12.py docs/GUITION_M12_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itests/fx_stubs tests/sample_playback_test.cpp -o /tmp/sample_playback_test && /tmp/sample_playback_test
      - run: python tests/analyze_m13.py docs/GUITION_M13_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m13.py docs/GUITION_M13_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m13.py docs/GUITION_M13_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/slice_bank_test.cpp -o /tmp/slice_bank_test && /tmp/slice_bank_test
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/waveform_test.cpp -o /tmp/waveform_test && /tmp/waveform_test
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/slice_playback_test.cpp -o /tmp/slice_playback_test && /tmp/slice_playback_test
      - run: python tests/analyze_m14.py docs/GUITION_M14_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m14.py docs/GUITION_M14_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m14.py docs/GUITION_M14_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/slice_lock_test.cpp -o /tmp/slice_lock_test && /tmp/slice_lock_test
      - run: python tests/no_slice_lock_equivalence.py
      - run: python tests/analyze_m15.py docs/GUITION_M15_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m15.py docs/GUITION_M15_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m15.py docs/GUITION_M15_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/project_test.cpp -o /tmp/project_test && /tmp/project_test
      - run: python tests/no_project_equivalence.py
      - run: python tests/analyze_m16.py docs/GUITION_M16_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m16.py docs/GUITION_M16_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m16.py docs/GUITION_M16_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/chain_test.cpp -o /tmp/chain_test && /tmp/chain_test
      - run: python tests/no_chain_equivalence.py
      - run: python tests/project_migration.py
      - run: python tests/analyze_m17.py docs/GUITION_M17_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m17.py docs/GUITION_M17_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m17.py docs/GUITION_M17_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/performance_test.cpp -o /tmp/performance_test && /tmp/performance_test
      - run: python tests/no_performance_equivalence.py
      - run: python tests/analyze_m18.py docs/GUITION_M18_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m18.py docs/GUITION_M18_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m18.py docs/GUITION_M18_NORMAL_SERIAL.log --normal

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/repeat_engine_test.cpp -o /tmp/repeat_engine_test && /tmp/repeat_engine_test
      - run: python tests/no_repeat_equivalence.py
      - run: python tests/analyze_m181.py docs/GUITION_M181_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m181.py docs/GUITION_M181_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m181.py docs/GUITION_M181_NORMAL_SERIAL.log --normal

      - run: pio run -e guition_transient_stress -e guition_transient_synth_stress
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/transient_test.cpp -o /tmp/transient_test && /tmp/transient_test
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itests/transient_stubs tests/transient_service_test.cpp -o /tmp/transient_service_test && /tmp/transient_service_test
      - run: python tests/no_transient_equivalence.py
      - run: python tests/analyze_m19.py docs/GUITION_M19_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m19.py docs/GUITION_M19_SYNTH_STRESS_SERIAL.log --synth
      - run: python tests/analyze_m19.py docs/GUITION_M19_NORMAL_SERIAL.log --normal
      - run: python tests/physical_sd/analyze.py

      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/ui_layout_test.cpp -o /tmp/ui_layout_test && /tmp/ui_layout_test
      - run: python tests/no_ui_equivalence.py
      - run: python tests/render_ui.py
      - run: pio run -e guition_ui20_stress -e guition_ui20_synth_stress
      - run: python tests/analyze_m20.py docs/GUITION_M20_SAMPLE_STRESS_SERIAL.log
      - run: python tests/analyze_m20.py docs/GUITION_M20_SYNTH_STRESS_SERIAL.log --synth

      - run: python tests/interpolation_checks.py
      - run: pip install numpy==2.3.5
      - run: python tests/interpolation_quality.py
      - run: pio run -e guition_interp_nearest_stress -e guition_interp_linear_stress -e guition_interp_hermite_stress
      - run: pio run -e guition_interp_nearest_fractional_stress -e guition_interp_linear_fractional_stress
      - run: python tests/analyze_m21.py
      - run: python tests/analyze_m20.py docs/GUITION_M21_NEAREST_FINAL_SERIAL.log
      - run: python tests/analyze_m20.py docs/GUITION_M21_SYNTH_STRESS_SERIAL.log --synth

      # M21.1 engineering candidates remain separate from production acceptance.
      - run: python tests/pcm_cache_checks.py
      - run: python tests/pcm_cache_checks.py --full-gain
      - run: python tests/m212_checks.py
      - run: python tests/m212_magnitude_checks.py
      - run: python tests/m212_trace_checks.py
      - run: pio run -e guition_m212_memory -e guition_m212_B_nearest -e guition_m212_B_linear32 -e guition_m212_C_nearest -e guition_m212_C_linear32 -e guition_m212_A_linear32 -e guition_m212_B_magnitude -e guition_m212_B_validated -e guition_m212_B_full_gain
      - run: python tests/archive_firmware.py guition_m212_B_nearest .pio/m212-ci-artifacts/B_NEAREST --pio-home ~/.platformio
      - run: python tests/analyze_m211.py
      - run: python tests/m213_checks.py
      - run: python tests/m213_capture_test.py
      - run: python tests/m213_sd_prepare.py
      - run: pio run -d .pio/m19p -e guition_m213_sd_0 -e guition_m213_sd_1 -e guition_m213_sd_2 -e guition_m213_sd_direct_1
      - run: python tests/analyze_m213.py --require-case B_NORMAL
      - run: pio run -e guition_m213_memory -e guition_m213_B_current -e guition_m213_B_stagger -e guition_m213_B_normal -e guition_m213_B_reverse_order -e guition_m213_B_normal_cache -e guition_m213_B_linear -e guition_m213_B_magnitude -e guition_m213_C_magnitude -e guition_m213_A_magnitude -e guition_m213_B_profile -e guition_m213_B_linear_direct -e guition_m213_B_magnitude_direct -e guition_m213_C_magnitude_direct -e guition_m213_A_magnitude_direct
      - run: pio run -e guition_m213_B_sustained -e guition_m213_synth -e guition_m213_B_pad_linear_direct -e guition_m213_B_pad_linear_cache -e guition_m213_B_pad_magnitude_cache -e guition_m213_B_pad_magnitude_direct -e guition_m213_C_pad_magnitude_direct -e guition_m213_A_pad_magnitude_direct -e guition_m213_B_pad_sustained -e guition_m213_synth_pad_sustained
      - run: pio run -e guition_pcm_locality -e guition_pcm_cache_nearest_fractional -e guition_pcm_cache_linear_fractional -e guition_pcm_cache_nearest_mixed -e guition_pcm_cache_nearest_profile -e guition_pcm_cache_linear32_fractional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m211-matching-firmware
          path: |
            .pio/build/guition_pcm*/firmware.elf
            .pio/build/guition_pcm*/firmware.bin
            .pio/build/guition_pcm*/firmware.map
            .pio/build/guition_m212*/firmware.elf
            .pio/build/guition_m212*/firmware.bin
            .pio/build/guition_m212*/firmware.map
            .pio/build/guition_m212*/bootloader.bin
            .pio/build/guition_m212*/partitions.bin
            .pio/m212-ci-artifacts/
            .pio/build/guition_m213*/firmware.elf
            .pio/build/guition_m213*/firmware.bin
            .pio/build/guition_m213*/firmware.map
          retention-days: 30
